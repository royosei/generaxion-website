<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join — GeneraXion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a href="index.html" class="brand">
          <img
            src="images/logo.jpeg"
            alt="GeneraXion logo"
            class="brand-stamp"
          />
          GeneraXion<span class="brand-tagline">With a Purpose</span>
        </a>
      </div>
    </header>

    <div class="auth-wrap">
      <div class="auth-card">
        <h1>Join the club</h1>
        <p class="sub">Create your account to RSVP to events.</p>

        <form id="signupForm">
          <div class="field">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" required autocomplete="name" />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              required
              minlength="6"
              autocomplete="new-password"
            />
          </div>
          <button type="submit" class="btn btn-primary">Create account</button>
          <div id="message" class="form-message"></div>
        </form>

        <p class="switch-link">
          Already a member? <a href="login.html">Log in</a>
        </p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script>
      const form = document.getElementById("signupForm");
      const message = document.getElementById("message");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fullName = document.getElementById("fullName").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        message.className = "form-message";
        message.textContent = "";

        const { error } = await signUp(fullName, email, password);

        if (error) {
          message.textContent = error.message;
          message.className = "form-message error";
        } else {
          message.textContent =
            "Account created! Check your email to confirm, then log in.";
          message.className = "form-message success";
          form.reset();
        }
      });
    </script>
  </body>
</html>
